<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械能守恒章节测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Times New Roman", "SimSun", "宋体", serif;
  background: #f0f0f0; color: #1a1a1a; line-height: 1.9; min-height: 100vh;
}
.app { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: #fff; border-bottom: 1px solid #d0d0d0; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.top-title { font-size: 17px; font-weight: bold; color: #333; }
.top-section { font-size: 14px; color: #4a90d9; font-weight: bold; }
.top-info { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #666; }
.student-tag { color: #4a90d9; font-weight: 600; }
.page-ind { font-size: 14px; color: #666; }
.page-ind .cur { font-weight: bold; color: #1a1a1a; font-size: 18px; }

.progress-bar { height: 3px; background: #e0e0e0; }
.progress-fill { height: 100%; background: #4a90d9; transition: width .3s; width: 0; }
.progress-fill.s2 { background: #e67e22; }
.progress-fill.s3 { background: #8e44ad; }

.content { flex: 1; display: flex; justify-content: center; padding: 30px 20px; overflow-y: auto; }
.paper {
  background: #fff; width: 100%; max-width: 820px; min-height: 600px;
  padding: 40px 55px; box-shadow: 0 2px 12px rgba(0,0,0,.1); border-radius: 4px;
}

.pp { display: none; }
.pp.active { display: block; }

.cover { text-align: center; padding: 60px 0; }
.cover h2 { font-size: 26px; margin-bottom: 16px; letter-spacing: 2px; }
.cover .sub { font-size: 15px; color: #555; margin-bottom: 30px; line-height: 2; }
.cover .tip { font-size: 13px; color: #999; margin-top: 30px; }

.q-num { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
.q-stem { margin-bottom: 14px; text-align: justify; font-size: 15px; }

/* 选项 */
.opt {
  display: flex; align-items: flex-start; width: 100%; text-align: left;
  padding: 8px 14px; border: 2px solid #d0d0d0; background: #fafafa;
  border-radius: 6px; cursor: pointer; transition: all .15s; margin-bottom: 8px;
  font-family: inherit; font-size: 14px; line-height: 1.7; color: #333;
}
.opt:hover { border-color: #4a90d9; background: #f0f6ff; }
.opt.selected { border-color: #4a90d9; background: #e3f0ff; box-shadow: 0 0 0 1px #4a90d9; }
.opt.disabled { pointer-events: none; opacity: .7; }
.opt .lab { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; min-width: 26px; border: 2px solid #ccc; border-radius: 50%; font-weight: bold; font-size: 13px; margin-right: 10px; margin-top: 2px; color: #555; }
.opt.selected .lab { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.opt .txt { flex: 1; }

/* 答题卡 */
.answer-card {
  border: 2px solid #888; border-radius: 6px; padding: 16px 18px; margin-top: 16px;
  background: #fcfcfc;
}
.answer-card .ac-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #333; }
.answer-card .ac-item { margin-bottom: 12px; }
.answer-card .ac-label { font-size: 13px; color: #555; margin-bottom: 5px; }
.conf-group { display: flex; gap: 10px; flex-wrap: wrap; }
.conf-opt {
  padding: 5px 16px; border: 2px solid #d0d0d0; border-radius: 20px; cursor: pointer;
  font-size: 13px; background: #fafafa; transition: all .15s; font-family: inherit;
}
.conf-opt:hover { border-color: #4a90d9; }
.conf-opt.selected { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.conf-opt.disabled { pointer-events: none; opacity: .7; }

/* 提交/完成 */
.submit-area { text-align: center; padding: 30px 0; }
.submit-area h3 { font-size: 20px; margin-bottom: 10px; }
.submit-area p { color: #555; font-size: 14px; margin-bottom: 8px; }
.big-btn {
  padding: 12px 40px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer;
  color: #fff; font-family: inherit; transition: all .2s; margin-top: 10px;
}
.big-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.big-btn.s1 { background: #4a90d9; }
.big-btn.s2 { background: #e67e22; }
.big-btn.s3 { background: #8e44ad; }
.big-btn.finish { background: #52c41a; }
.big-btn:disabled { opacity: .5; cursor: not-allowed; }

.result-area { padding: 20px 0; }
.result-area h3 { font-size: 20px; margin-bottom: 14px; text-align: center; }
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
.result-table th, .result-table td { border: 1px solid #ddd; padding: 6px 10px; text-align: center; }
.result-table th { background: #f5f5f5; }

.nav-bar {
  background: #fff; border-top: 1px solid #d0d0d0; padding: 12px 20px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  position: sticky; bottom: 0; box-shadow: 0 -1px 4px rgba(0,0,0,.08);
}
.nav-btn {
  padding: 8px 22px; border: 1px solid #ccc; background: #fff; color: #333;
  font-size: 14px; cursor: pointer; border-radius: 4px; transition: all .2s; font-family: inherit;
}
.nav-btn:hover { background: #f5f5f5; }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #323232; color: #fff; padding: 12px 24px; border-radius: 24px;
  font-size: 14px; z-index: 300; opacity: 0; transition: opacity .3s;
  font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 80%;
}
.toast.show { opacity: 1; }
.toast.ok { background: #52c41a; }
.toast.err { background: #d93025; }

/* 自定义确认弹窗 */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.45); z-index: 400;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 8px; padding: 26px 30px;
  width: 90%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.25);
  text-align: center;
}
.modal-box .m-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #333; }
.modal-box .m-msg { font-size: 14px; color: #555; margin-bottom: 22px; white-space: pre-line; line-height: 1.9; }
.modal-box .m-btns { display: flex; gap: 14px; justify-content: center; }
.m-btn { padding: 9px 26px; border-radius: 6px; cursor: pointer; font-size: 14px; border: 1px solid #ccc; background: #fff; color: #333; font-family: inherit; }
.m-btn.primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.m-btn:hover { opacity: .85; }

@media (max-width: 768px) { .paper { padding: 30px 20px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div><span class="top-title">机械能守恒章节测试</span></div>
    <div class="top-section" id="sectionLabel"></div>
    <div class="top-info">
      <span class="student-tag" id="studentInfo"></span>
      <span class="page-ind"><span class="cur" id="currentPage">1</span> / <span id="totalPages">0</span></span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="content"><div class="paper" id="examPaper"></div></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">◀ 上一题</button>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">下一题 ▶</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="m-title" id="confirmTitle">确认提交</div>
    <div class="m-msg" id="confirmMsg"></div>
    <div class="m-btns">
      <button class="m-btn" onclick="closeConfirm(false)">取消</button>
      <button class="m-btn primary" id="confirmOkBtn" onclick="closeConfirm(true)">确认</button>
    </div>
  </div>
</div>

<script>
// ===== 全局状态 =====
var st = {
  studentName: '', studentId: '', studentDir: '',
  phase: 1,           // 1=第一大题, 2=第二大题, 3=第三大题
  cur: 0,
  pretest: [], correction: [], posttest: [],
  answers: {},        // {q0:{answer,reason,conf1,conf2}, c1:{answer}, p0:{...}}
  submitted: {s1:false, s2:false, s3:false},  // 各大题是否已提交（锁定）
  finished: false,    // 是否完成测试（全局锁定）
};

(function(){
  var p = new URLSearchParams(window.location.search);
  st.studentName = p.get('name') || '';
  st.studentId = p.get('id') || '';
  if (st.studentName && st.studentId) st.studentDir = st.studentName + '_' + st.studentId;
  var el = document.getElementById('studentInfo');
  if (el && st.studentName) el.textContent = st.studentName + ' | ' + st.studentId;
})();

function loadQuestions(section) {
  return fetch('/api/questions/' + section).then(function(r){ return r.json(); })
    .then(function(d){ return d.questions || []; });
}

function init() {
  Promise.all([loadQuestions('pretest'), loadQuestions('posttest')]).then(function(results){
    st.pretest = results[0];
    st.posttest = results[1];
    buildPhase1();
  }).catch(function(){ toast('题目加载失败，请刷新重试', 'err'); });
}

// ===== 页面构建 =====
var pages = [];

function buildPhase1() {
  pages = [];
  pages.push({type:'cover', phase:1, title:'第一大题', desc:'本大题共 10 道题。每题请先选择答案，再选择你的理由，并标注把握程度。'});
  st.pretest.forEach(function(q, i){ pages.push({type:'question', phase:1, qIndex:i, q:q}); });
  pages.push({type:'submit', phase:1, sectionName:'第一大题', btnText:'提交第一大题'});
  renderAll(); showPage(0);
}

function buildPhase2(corrQs) {
  pages = [];
  pages.push({type:'cover', phase:2, title:'第二大题', desc:'本大题根据你第一大题的作答情况生成。请认真完成。'});
  corrQs.forEach(function(q, i){ pages.push({type:'correction', phase:2, qIndex:i, q:q}); });
  pages.push({type:'submit', phase:2, sectionName:'第二大题', btnText:'提交第二大题'});
  renderAll(); showPage(0);
}

function buildPhase3() {
  pages = [];
  pages.push({type:'cover', phase:3, title:'第三大题', desc:'本大题共 10 道题。每题请先选择答案，再选择你的理由，并标注把握程度。'});
  st.posttest.forEach(function(q, i){ pages.push({type:'question', phase:3, qIndex:i, q:q}); });
  pages.push({type:'submit', phase:3, sectionName:'第三大题', btnText:'提交第三大题'});
  renderAll(); showPage(0);
}

function renderAll() {
  var html = '';
  pages.forEach(function(p, i){ html += renderPage(p, i); });
  document.getElementById('examPaper').innerHTML = html;
  document.getElementById('totalPages').textContent = pages.length;
  updateSectionLabel();
}

function updateSectionLabel() {
  var sn = {1:'第一大题', 2:'第二大题', 3:'第三大题'};
  var label = sn[st.phase] || '';
  if (st.finished) label = '测试完成';
  document.getElementById('sectionLabel').textContent = label;
}

function renderPage(p, pi) {
  var h = '<div class="pp" id="pp'+pi+'">';
  if (p.type === 'cover') {
    h += '<div class="cover"><h2>'+p.title+'</h2><div class="sub">'+p.desc+'</div>';
    h += '<div class="tip">点击下方"下一题"开始作答</div></div>';
  } else if (p.type === 'submit') {
    var cls = p.phase===1?'s1':(p.phase===2?'s2':'s3');
    h += '<div class="submit-area"><h3>'+p.sectionName+' 作答完毕</h3>';
    h += '<p>请检查本大题作答，提交后将锁定，无法修改。</p>';
    h += '<button class="big-btn '+cls+'" onclick="doSubmit('+p.phase+')">✓ '+p.btnText+'</button></div>';
  } else if (p.type === 'question') {
    var q = p.q;
    var qid = (p.phase === 1 ? 'q' : 'p') + (q.num - 1);
    var locked = st.submitted['s'+p.phase] || st.finished;
    var isMultiAnswer = (q.answer_key || '').length > 1;
    var isMultiReason = (q.reason_key || '').length > 1;
    h += '<div class="q-num">第'+q.num+'题'+(isMultiAnswer?'（多选）':'')+'</div>';
    h += '<div class="q-stem">'+q.stem+'</div>';
    // 题目选项
    q.options.forEach(function(opt){
      var key = opt.charAt(0);
      h += '<div class="opt'+(locked?' disabled':'')+'" data-multi="'+isMultiAnswer+'" id="opt_'+qid+'_'+key+'" onclick="selOpt(\''+qid+'\',\'answer\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+opt.substring(2)+'</span></div>';
    });
    // 答题卡
    h += '<div class="answer-card">';
    h += '<div class="ac-title">答题卡</div>';
    // 1. 答案选择（题目选项已在上面，这里说明）
    h += '<div class="ac-item"><div class="ac-label">1. 你选择的答案：请在题目选项中点击'+(isMultiAnswer?'（可多选）':'')+'</div></div>';
    // 2. 理由选择
    h += '<div class="ac-item"><div class="ac-label">2. 你选择该答案的理由：'+(isMultiReason?'（可多选）':'')+'</div>';
    q.reasons.forEach(function(rs){
      var key = rs.charAt(0);
      h += '<div class="opt'+(locked?' disabled':'')+'" data-multi="'+isMultiReason+'" id="reason_'+qid+'_'+key+'" onclick="selOpt(\''+qid+'\',\'reason\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+rs.substring(2)+'</span></div>';
    });
    h += '</div>';
    // 3. 把握程度（答案）
    h += '<div class="ac-item"><div class="ac-label">3. 你对所选答案的把握程度：</div><div class="conf-group">';
    ['很有把握','一般','没把握'].forEach(function(c){
      h += '<div class="conf-opt'+(locked?' disabled':'')+'" id="conf1_'+qid+'_'+c+'" onclick="selConf(\''+qid+'\',\'conf1\',\''+c+'\')">'+c+'</div>';
    });
    h += '</div></div>';
    // 4. 把握程度（理由）
    h += '<div class="ac-item"><div class="ac-label">4. 你对所选理由的把握程度：</div><div class="conf-group">';
    ['很有把握','一般','没把握'].forEach(function(c){
      h += '<div class="conf-opt'+(locked?' disabled':'')+'" id="conf2_'+qid+'_'+c+'" onclick="selConf(\''+qid+'\',\'conf2\',\''+c+'\')">'+c+'</div>';
    });
    h += '</div></div>';
    h += '</div>';
  } else if (p.type === 'correction') {
    var q = p.q;
    var qid = 'c' + (p.qIndex+1);
    var locked = st.submitted.s2 || st.finished;
    h += '<div class="q-num">第 '+(p.qIndex+1)+' 题</div>';
    h += '<div class="q-stem">'+q.stem+'</div>';
    q.options.forEach(function(opt){
      var key = opt.charAt(0);
      h += '<div class="opt'+(locked?' disabled':'')+'" id="opt_'+qid+'_'+key+'" onclick="selCorrOpt(\''+qid+'\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+opt.substring(2)+'</span></div>';
    });
  }
  h += '</div>';
  return h;
}

// ===== 交互 =====
function selOpt(qid, tier, key) {
  var prefix = tier==='answer'?'opt_':'reason_';
  var el = document.getElementById(prefix+qid+'_'+key);
  if (!el) return;
  var isMulti = el.getAttribute('data-multi') === 'true';

  if (isMulti) {
    // 多选：切换选中状态
    el.classList.toggle('selected');
    // 重新收集所有选中的字母（按顺序）
    var selected = [];
    var all = document.querySelectorAll('[id^="'+prefix+qid+'_"]');
    for (var i=0;i<all.length;i++) {
      if (all[i].classList.contains('selected')) {
        var id = all[i].id;
        selected.push(id.substring(id.lastIndexOf('_')+1));
      }
    }
    selected.sort();
    if (!st.answers[qid]) st.answers[qid] = {};
    st.answers[qid][tier] = selected.join('');
  } else {
    // 单选
    var all = document.querySelectorAll('[id^="'+prefix+qid+'_"]');
    for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
    el.classList.add('selected');
    if (!st.answers[qid]) st.answers[qid] = {};
    st.answers[qid][tier] = key;
  }
}
function selConf(qid, tier, val) {
  var prefix = tier+'_'+qid+'_';
  var all = document.querySelectorAll('[id^="'+prefix+'"]');
  for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
  var el = document.getElementById(prefix+val);
  if (el) el.classList.add('selected');
  if (!st.answers[qid]) st.answers[qid] = {};
  st.answers[qid][tier] = val;
}
function selCorrOpt(qid, key) {
  var all = document.querySelectorAll('[id^="opt_'+qid+'_"]');
  for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
  var el = document.getElementById('opt_'+qid+'_'+key);
  if (el) el.classList.add('selected');
  if (!st.answers[qid]) st.answers[qid] = {};
  st.answers[qid].answer = key;
}

function showPage(idx) {
  if (idx < 0 || idx >= pages.length) return;
  st.cur = idx;
  var all = document.querySelectorAll('.pp');
  for (var i=0;i<all.length;i++) all[i].classList.remove('active');
  var cur = document.getElementById('pp'+idx);
  if (cur) cur.classList.add('active');
  document.getElementById('currentPage').textContent = idx+1;
  document.getElementById('prevBtn').disabled = (idx===0);
  document.getElementById('nextBtn').disabled = (idx===pages.length-1);
  var pf = document.getElementById('progressFill');
  pf.style.width = ((idx+1)/pages.length*100)+'%';
  pf.className = 'progress-fill' + (st.phase===2?' s2':(st.phase===3?' s3':''));
  document.querySelector('.content').scrollTop = 0;
}
function go(d) { showPage(st.cur + d); }

// ===== 收集答案 =====
function collectAnswers(phase) {
  var result = {};
  for (var qid in st.answers) {
    if (phase === 1 && qid.charAt(0)==='q') result[qid] = st.answers[qid];
    else if (phase === 2 && qid.charAt(0)==='c') result[qid] = st.answers[qid];
    else if (phase === 3 && qid.charAt(0)==='p') result[qid] = st.answers[qid];
  }
  return result;
}

// ===== 提交（带确认框） =====
function doSubmit(phase) {
  var secName = ['','第一大题','第二大题','第三大题'][phase];
  showConfirm('确认提交' + secName + '？\n\n提交后将锁定本大题作答，无法修改。', function(){
    submitPhase(phase);
  });
}

function submitPhase(phase) {

  if (phase === 1) {
    var payload = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's1', answers: collectAnswers(1)
    };
    fetch('/api/submit/pretest', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        st.submitted.s1 = true;
        toast('第一大题已提交，正在生成第二大题...', 'ok');
        st.correction = d.correction ? d.correction.correction_questions : [];
        st.phase = 2;
        if (st.correction.length > 0) buildPhase2(st.correction);
        else { toast('第一大题全部答对，直接进入第三大题', 'ok'); st.phase = 3; buildPhase3(); }
      } else { toast('提交失败，请重试', 'err'); }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  } else if (phase === 2) {
    var payload2 = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's2', answers: collectAnswers(2), correction_questions: st.correction
    };
    fetch('/api/submit/correction', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload2)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        st.submitted.s2 = true;
        toast('第二大题已提交，进入第三大题', 'ok');
        st.phase = 3;
        buildPhase3();
      } else { toast('提交失败，请重试', 'err'); }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  } else if (phase === 3) {
    var payload3 = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's3', answers: collectAnswers(3), pretest_answers: collectAnswers(1)
    };
    fetch('/api/submit/posttest', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload3)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        st.submitted.s3 = true;
        st.finished = true;
        showThankYouPage();
      } else { toast('提交失败，请重试', 'err'); }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  }
}

// ===== 感谢页（提交第三大题后直接显示） =====
function showThankYouPage() {
  pages = [];
  var h = '<div class="result-area" style="padding:60px 0;"><h3 style="font-size:24px;">测试完成，感谢作答！</h3>';
  h += '<p style="text-align:center;color:#555;font-size:15px;">本次测试已结束，你可以关闭此页面。</p>';
  h += '</div>';
  document.getElementById('examPaper').innerHTML = '<div class="pp active">'+h+'</div>';
  document.getElementById('totalPages').textContent = 1;
  document.getElementById('currentPage').textContent = 1;
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('sectionLabel').textContent = '测试完成';
  document.getElementById('progressFill').style.width = '100%';
  toast('测试已提交，感谢作答', 'ok');
}

// ===== 自定义确认弹窗 =====
var confirmCallback = null;
function showConfirm(msg, onConfirm, title) {
  confirmCallback = onConfirm;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmTitle').textContent = title || '确认提交';
  document.getElementById('confirmOkBtn').textContent = title || '确认';
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(ok) {
  document.getElementById('confirmModal').classList.remove('show');
  var cb = confirmCallback;
  confirmCallback = null;
  if (ok && cb) cb();
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+(type||'')+' show';
  setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

init();
</script>
