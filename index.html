<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械能守恒章节·四阶测试问卷</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Times New Roman", "SimSun", "宋体", serif;
  background: #f0f0f0; color: #1a1a1a; line-height: 1.9; min-height: 100vh;
}
.app { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: #fff; border-bottom: 1px solid #d0d0d0; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.top-title { font-size: 16px; font-weight: bold; color: #333; }
.top-section { font-size: 14px; color: #4a90d9; font-weight: bold; }
.top-info { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #666; }
.student-tag { color: #4a90d9; font-weight: 600; }
.page-ind { font-size: 14px; color: #666; }
.page-ind .cur { font-weight: bold; color: #1a1a1a; font-size: 18px; }

.progress-bar { height: 3px; background: #e0e0e0; }
.progress-fill { height: 100%; background: #4a90d9; transition: width .3s; width: 0; }
.progress-fill.s2 { background: #e67e22; }
.progress-fill.s3 { background: #8e44ad; }

.content { flex: 1; display: flex; justify-content: center; padding: 30px 20px; overflow-y: auto; }
.paper {
  background: #fff; width: 100%; max-width: 820px; min-height: 600px;
  padding: 40px 55px; box-shadow: 0 2px 12px rgba(0,0,0,.1); border-radius: 4px;
}

.pp { display: none; }
.pp.active { display: block; }

/* 封面/阶段页 */
.cover { text-align: center; padding: 50px 0; }
.cover h2 { font-size: 26px; margin-bottom: 16px; letter-spacing: 2px; }
.cover .sub { font-size: 16px; color: #555; margin-bottom: 30px; }
.cover .info { font-size: 14px; color: #555; line-height: 2.2; text-align: left; display: inline-block; }

/* 题目页 */
.src { font-size: 11px; color: #2f5496; margin-bottom: 2px; }
.miscon-tag { font-size: 11px; color: #9c27b0; font-weight: bold; margin-bottom: 10px; }
.q-num { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
.q-stem { margin-bottom: 12px; text-align: justify; font-size: 15px; }

.tier-title { font-size: 14px; font-weight: bold; color: #333; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #eee; }

.opt {
  display: flex; align-items: flex-start; width: 100%; text-align: left;
  padding: 8px 14px; border: 2px solid #d0d0d0; background: #fafafa;
  border-radius: 6px; cursor: pointer; transition: all .15s; margin-bottom: 8px;
  font-family: inherit; font-size: 14px; line-height: 1.7; color: #333;
}
.opt:hover { border-color: #4a90d9; background: #f0f6ff; }
.opt.selected { border-color: #4a90d9; background: #e3f0ff; box-shadow: 0 0 0 1px #4a90d9; }
.opt .lab { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; min-width: 26px; border: 2px solid #ccc; border-radius: 50%; font-weight: bold; font-size: 13px; margin-right: 10px; margin-top: 2px; color: #555; }
.opt.selected .lab { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.opt .txt { flex: 1; }

.conf-group { display: flex; gap: 12px; flex-wrap: wrap; }
.conf-opt {
  padding: 6px 18px; border: 2px solid #d0d0d0; border-radius: 20px; cursor: pointer;
  font-size: 13px; background: #fafafa; transition: all .15s; font-family: inherit;
}
.conf-opt:hover { border-color: #4a90d9; }
.conf-opt.selected { background: #4a90d9; color: #fff; border-color: #4a90d9; }

/* 提交页 */
.submit-area { text-align: center; padding: 30px 0; }
.submit-area h3 { font-size: 20px; margin-bottom: 10px; }
.submit-area p { color: #555; font-size: 14px; margin-bottom: 8px; }
.big-btn {
  padding: 12px 40px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer;
  color: #fff; font-family: inherit; transition: all .2s; margin-top: 10px;
}
.big-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.big-btn.s1 { background: #4a90d9; }
.big-btn.s2 { background: #e67e22; }
.big-btn.s3 { background: #8e44ad; }
.big-btn.done { background: #52c41a; }

/* 结果页 */
.result-area { padding: 20px 0; }
.result-area h3 { font-size: 20px; margin-bottom: 14px; text-align: center; }
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
.result-table th, .result-table td { border: 1px solid #ddd; padding: 6px 10px; text-align: center; }
.result-table th { background: #f5f5f5; }

.nav-bar {
  background: #fff; border-top: 1px solid #d0d0d0; padding: 12px 20px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  position: sticky; bottom: 0; box-shadow: 0 -1px 4px rgba(0,0,0,.08);
}
.nav-btn {
  padding: 8px 22px; border: 1px solid #ccc; background: #fff; color: #333;
  font-size: 14px; cursor: pointer; border-radius: 4px; transition: all .2s; font-family: inherit;
}
.nav-btn:hover { background: #f5f5f5; }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #323232; color: #fff; padding: 12px 24px; border-radius: 24px;
  font-size: 14px; z-index: 300; opacity: 0; transition: opacity .3s;
  font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 80%;
}
.toast.show { opacity: 1; }
.toast.ok { background: #52c41a; }
.toast.err { background: #d93025; }

@media (max-width: 768px) { .paper { padding: 30px 20px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div><span class="top-title">机械能守恒章节·四阶测试问卷</span></div>
    <div class="top-section" id="sectionLabel"></div>
    <div class="top-info">
      <span class="student-tag" id="studentInfo"></span>
      <span class="page-ind"><span class="cur" id="currentPage">1</span> / <span id="totalPages">0</span></span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="content"><div class="paper" id="examPaper"></div></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">◀ 上一题</button>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">下一题 ▶</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 全局状态 =====
var st = {
  studentName: '', studentId: '', studentDir: '',
  phase: 1,           // 1=前测, 2=纠错, 3=后测
  cur: 0,             // 当前页索引
  pretest: [],        // 前测题目
  correction: [],     // 第二大题（纠错）
  posttest: [],       // 后测题目
  answers: {},        // 答题记录 { qid: {answer, reason, conf1, conf2} }
  correctionResult: null, // 前测提交后返回的纠错结果
};

// ===== 读取学生信息 =====
(function(){
  var p = new URLSearchParams(window.location.search);
  st.studentName = p.get('name') || '';
  st.studentId = p.get('id') || '';
  if (st.studentName && st.studentId) st.studentDir = st.studentName + '_' + st.studentId;
  var el = document.getElementById('studentInfo');
  if (el && st.studentName) el.textContent = st.studentName + ' | ' + st.studentId;
})();

// ===== 题目加载 =====
function loadQuestions(section) {
  return fetch('/api/questions/' + section).then(function(r){ return r.json(); })
    .then(function(d){ return d.questions || []; });
}

function init() {
  Promise.all([loadQuestions('pretest'), loadQuestions('posttest')]).then(function(results){
    st.pretest = results[0];
    st.posttest = results[1];
    buildPhase1();
  }).catch(function(e){
    toast('题目加载失败，请刷新重试', 'err');
  });
}

// ===== 页面构建 =====
var pages = []; // {type, phase, qIndex, ...}

function buildPhase1() {
  pages = [];
  // 封面
  pages.push({type:'cover', phase:1, title:'第一大题 · 前测', desc:'本大题共10道题，每题包含四部分：答案选择、理由选择、对答案的信心指数、对理由的信心指数。请认真作答。'});
  // 前测题目（每题一页）
  st.pretest.forEach(function(q, i){
    pages.push({type:'question', phase:1, qIndex:i, q:q, sectionName:'第一大题'});
  });
  // 提交页
  pages.push({type:'submit', phase:1, sectionName:'第一大题', btn:'提交第一大题，生成纠错题'});
  renderAll();
  showPage(0);
}

function buildPhase2(correctionQuestions) {
  pages = [];
  pages.push({type:'cover', phase:2, title:'第二大题 · 纠错练习', desc:'根据你第一大题的答题情况，系统已为你生成针对性的纠错练习。请认真完成。'});
  correctionQuestions.forEach(function(q, i){
    pages.push({type:'correction', phase:2, qIndex:i, q:q, sectionName:'第二大题'});
  });
  pages.push({type:'submit', phase:2, sectionName:'第二大题', btn:'提交第二大题'});
  renderAll();
  showPage(0);
}

function buildPhase3() {
  pages = [];
  pages.push({type:'cover', phase:3, title:'第三大题 · 后测', desc:'本大题共10道题，用于检测学习后的掌握情况。请认真作答。'});
  st.posttest.forEach(function(q, i){
    pages.push({type:'question', phase:3, qIndex:i, q:q, sectionName:'第三大题'});
  });
  pages.push({type:'submit', phase:3, sectionName:'第三大题', btn:'提交第三大题，生成诊断报告'});
  renderAll();
  showPage(0);
}

// ===== 渲染 =====
function renderAll() {
  var html = '';
  pages.forEach(function(p, i){
    html += renderPage(p, i);
  });
  document.getElementById('examPaper').innerHTML = html;
  document.getElementById('totalPages').textContent = pages.length;
}

function renderPage(p, pi) {
  var h = '<div class="pp" id="pp'+pi+'">';
  if (p.type === 'cover') {
    h += '<div class="cover"><h2>'+p.title+'</h2><div class="sub">'+p.desc+'</div></div>';
  } else if (p.type === 'submit') {
    var cls = p.phase===1?'s1':(p.phase===2?'s2':'s3');
    h += '<div class="submit-area"><h3>'+p.sectionName+' 答题完毕</h3>';
    h += '<p>请检查作答，确认无误后提交。</p>';
    h += '<button class="big-btn '+cls+'" onclick="doSubmit('+p.phase+')">✓ '+p.btn+'</button></div>';
  } else if (p.type === 'question') {
    var q = p.q;
    // 前测用 'q0'~'q9'，后测用 'p0'~'p9'，避免混淆
    var qid = (p.phase === 1 ? 'q' : 'p') + (q.num - 1);
    h += '<div class="src">【题目出处】'+q.src+'</div>';
    h += '<div class="miscon-tag">诊断'+q.miscon+'</div>';
    h += '<div class="q-num">第'+q.num+'题</div>';
    h += '<div class="q-stem">'+q.stem+'</div>';
    // 答案阶
    h += '<div class="tier-title">【一、答案选择】</div>';
    q.options.forEach(function(opt){
      var key = opt.charAt(0);
      h += '<div class="opt" id="opt_'+qid+'_'+key+'" onclick="selOpt(\''+qid+'\',\'answer\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+opt.substring(2)+'</span></div>';
    });
    // 理由阶
    h += '<div class="tier-title">【二、理由选择】</div>';
    q.reasons.forEach(function(rs){
      var key = rs.charAt(0);
      h += '<div class="opt" id="reason_'+qid+'_'+key+'" onclick="selOpt(\''+qid+'\',\'reason\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+rs.substring(2)+'</span></div>';
    });
    // 信心指数
    h += '<div class="tier-title">【三、信心指数】</div>';
    h += '<div style="font-size:13px;color:#666;margin-bottom:4px;">（1）对本题【答案选择】的信心指数：</div>';
    h += '<div class="conf-group">';
    ['很有信心','一般','没把握'].forEach(function(c){
      h += '<div class="conf-opt" id="conf1_'+qid+'_'+c+'" onclick="selConf(\''+qid+'\',\'conf1\',\''+c+'\')">'+c+'</div>';
    });
    h += '</div>';
    h += '<div style="font-size:13px;color:#666;margin:10px 0 4px;">（2）对本题【理由选择】的信心指数：</div>';
    h += '<div class="conf-group">';
    ['很有信心','一般','没把握'].forEach(function(c){
      h += '<div class="conf-opt" id="conf2_'+qid+'_'+c+'" onclick="selConf(\''+qid+'\',\'conf2\',\''+c+'\')">'+c+'</div>';
    });
    h += '</div>';
  } else if (p.type === 'correction') {
    var q = p.q;
    var qid = 'c' + (p.qIndex+1);
    h += '<div class="src">【纠错练习】'+q.miscon+' · '+q.name+'</div>';
    h += '<div class="q-num">纠错题 '+(p.qIndex+1)+'</div>';
    h += '<div class="q-stem">'+q.stem+'</div>';
    h += '<div class="tier-title">【答案选择】</div>';
    q.options.forEach(function(opt){
      var key = opt.charAt(0);
      h += '<div class="opt" id="opt_'+qid+'_'+key+'" onclick="selCorrOpt(\''+qid+'\',\''+key+'\')"><span class="lab">'+key+'</span><span class="txt">'+opt.substring(2)+'</span></div>';
    });
  }
  h += '</div>';
  return h;
}

// ===== 交互 =====
function selOpt(qid, tier, key) {
  // 清除同tier的选中
  var prefix = tier==='answer'?'opt_':'reason_';
  var all = document.querySelectorAll('[id^="'+prefix+qid+'_"]');
  for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
  var el = document.getElementById(prefix+qid+'_'+key);
  if (el) el.classList.add('selected');
  if (!st.answers[qid]) st.answers[qid] = {};
  st.answers[qid][tier] = key;
}

function selConf(qid, tier, val) {
  var prefix = tier+'_'+qid+'_';
  var all = document.querySelectorAll('[id^="'+prefix+'"]');
  for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
  var el = document.getElementById(prefix+val);
  if (el) el.classList.add('selected');
  if (!st.answers[qid]) st.answers[qid] = {};
  st.answers[qid][tier] = val;
}

function selCorrOpt(qid, key) {
  var all = document.querySelectorAll('[id^="opt_'+qid+'_"]');
  for (var i=0;i<all.length;i++) all[i].classList.remove('selected');
  var el = document.getElementById('opt_'+qid+'_'+key);
  if (el) el.classList.add('selected');
  if (!st.answers[qid]) st.answers[qid] = {};
  st.answers[qid].answer = key;
}

// ===== 翻页 =====
function showPage(idx) {
  if (idx < 0 || idx >= pages.length) return;
  st.cur = idx;
  var all = document.querySelectorAll('.pp');
  for (var i=0;i<all.length;i++) all[i].classList.remove('active');
  var cur = document.getElementById('pp'+idx);
  if (cur) cur.classList.add('active');
  document.getElementById('currentPage').textContent = idx+1;
  document.getElementById('prevBtn').disabled = (idx===0);
  document.getElementById('nextBtn').disabled = (idx===pages.length-1);
  var pf = document.getElementById('progressFill');
  pf.style.width = ((idx+1)/pages.length*100)+'%';
  var sn = {1:'第一大题 · 前测', 2:'第二大题 · 纠错', 3:'第三大题 · 后测'};
  document.getElementById('sectionLabel').textContent = sn[st.phase] || '';
  document.querySelector('.content').scrollTop = 0;
}

function go(d) { showPage(st.cur + d); }

// ===== 提交 =====
function doSubmit(phase) {
  if (phase === 1) {
    // 提交前测，生成第二大题
    var payload = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's1', answers: collectAnswers(1)
    };
    fetch('/api/submit/pretest', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        st.correctionResult = d.correction;
        var wrongCount = d.correction ? d.correction.total_wrong : 0;
        toast('第一大题已提交！检测到 '+wrongCount+' 道错题，正在生成纠错题...', 'ok');
        // 构建第二大题
        var cq = d.correction ? d.correction.correction_questions : [];
        st.correction = cq;
        st.phase = 2;
        if (cq.length > 0) {
          buildPhase2(cq);
        } else {
          // 没有错题，直接进入后测
          toast('全部答对！跳过纠错，进入第三大题', 'ok');
          st.phase = 3;
          buildPhase3();
        }
      } else {
        toast('提交失败，请重试', 'err');
      }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  } else if (phase === 2) {
    // 提交第二大题
    var payload2 = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's2', answers: collectAnswers(2)
    };
    fetch('/api/submit/correction', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload2)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        toast('第二大题已提交！进入第三大题', 'ok');
        st.phase = 3;
        buildPhase3();
      } else {
        toast('提交失败，请重试', 'err');
      }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  } else if (phase === 3) {
    // 提交后测，生成诊断报告
    var pretestAnswers = collectAnswers(1);
    var correctionAnswers = collectAnswers(2);
    var payload3 = {
      studentName: st.studentName, studentId: st.studentId, studentDir: st.studentDir,
      section: 's3', answers: collectAnswers(3),
      pretest_answers: pretestAnswers,
      correction_answers: correctionAnswers,
      correction_questions: st.correction
    };
    fetch('/api/submit/posttest', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload3)
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.success) {
        showResult(d.report);
      } else {
        toast('提交失败，请重试', 'err');
      }
    }).catch(function(){ toast('提交失败，请检查网络', 'err'); });
  }
}

function collectAnswers(phase) {
  var result = {};
  for (var qid in st.answers) {
    if (phase === 1 && qid.charAt(0)==='q') result[qid] = st.answers[qid];
    else if (phase === 2 && qid.charAt(0)==='c') result[qid] = st.answers[qid];
    else if (phase === 3 && qid.charAt(0)==='p') result[qid] = st.answers[qid];
  }
  return result;
}

function showResult(report) {
  pages = [];
  var h = '';
  h += '<div class="result-area"><h3>答题完成！</h3>';
  if (report) {
    h += '<table class="result-table"><tr><th>报告名称</th><th>状态</th></tr>';
    var items = [
      ['第一大题（前测）诊断报告', report.pretest],
      ['第二大题（纠错）诊断报告', report.correction],
      ['第三大题（后测）诊断报告', report.posttest],
      ['前后测对比分析报告', report.comparison]
    ];
    for (var i=0;i<items.length;i++) {
      var done = items[i][1] ? true : false;
      h += '<tr><td>'+items[i][0]+'</td><td>'+(done ? '✓ 已生成' : '—')+'</td></tr>';
    }
    h += '</table>';
    h += '<p style="text-align:center;color:#555;">四份 Word 诊断报告已保存至后台开发空间（student_data/姓名_学号/reports/）</p>';
  } else {
    h += '<p style="text-align:center;color:#555;">答题数据已提交至后台开发空间</p>';
  }
  h += '</div>';
  document.getElementById('examPaper').innerHTML = '<div class="pp active">'+h+'</div>';
  document.getElementById('totalPages').textContent = 1;
  document.getElementById('currentPage').textContent = 1;
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('sectionLabel').textContent = '答题完成';
  document.getElementById('progressFill').style.width = '100%';
}

// ===== Toast =====
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+(type||'')+' show';
  setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

// ===== 启动 =====
init();
</script>
</body>
</html>
